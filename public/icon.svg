<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" rx="100" fill="#0c0a09" />
  <circle cx="256" cy="256" r="220" fill="none" stroke="#d97706" stroke-width="8" opacity="0.6"/>
  
  <!-- Open Book Base -->
  <path d="M 120 370 Q 256 340 256 390 Q 256 340 392 370 L 392 300 Q 256 270 256 320 Q 256 270 120 300 Z" fill="#fef3c7" opacity="0.95"/>
  <path d="M 130 360 Q 256 335 256 380 Q 256 335 382 360 L 382 310 Q 256 285 256 330 Q 256 285 130 310 Z" fill="#fde68a" />
  
  <!-- Golden Latin Cross -->
  <g fill="#f59e0b" filter="drop-shadow(0px 4px 12px rgba(245, 158, 11, 0.4))">
    <!-- Vertical bar -->
    <rect x="236" y="90" width="40" height="230" rx="6" fill="url(#goldGrad)" />
    <!-- Horizontal beam -->
    <rect x="156" y="150" width="200" height="40" rx="6" fill="url(#goldGrad)" />
  </g>
  
  <!-- Radiance / Rays -->
  <circle cx="256" cy="170" r="12" fill="#fffbeb" opacity="0.9"/>
  <path d="M 256 120 L 256 100 M 256 220 L 256 240 M 180 170 L 160 170 M 332 170 L 352 170" stroke="#fef08a" stroke-width="4" stroke-linecap="round" opacity="0.7"/>

  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
</svg>
